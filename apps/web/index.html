<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a47" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfScoreHQ" />
    <title>GolfScoreHQ</title>
    <!-- The splash: shown the moment the app opens, faded out by lib/splash.ts once the app is up. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: repeating-linear-gradient(135deg, rgb(255 255 255 / 0.035) 0 34px, transparent 34px 68px), radial-gradient(circle at 50% 38%, #1d4f86 0, #0f2a47 62%);
        color: #fff; font-family: 'Arial Narrow', -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.35s ease;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); animation: splash-pop 0.6s cubic-bezier(.2, 1.4, .4, 1) both; }
      #splash .name { font-size: 2.4rem; font-weight: 700; letter-spacing: 0.02em; animation: splash-up 0.5s 0.15s ease-out both; }
      #splash .tag { font-size: 1rem; opacity: 0.75; animation: splash-up 0.5s 0.3s ease-out both; }
      /* A putt: the ball rolls across, slows at the lip and drops in, just before the splash fades (lib/splash.ts: 3 s). */
      #splash .green { position: relative; width: 230px; height: 18px; margin-top: 22px; }
      #splash .green::before { content: ''; position: absolute; right: 0; top: 6px; width: 18px; height: 9px; border-radius: 50%; background: #06182b; box-shadow: inset 0 2px 3px rgb(0 0 0 / 0.6); }
      #splash .ball { position: absolute; left: 0; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0, #fff 45%, #d9dde2 100%); box-shadow: 0 2px 3px rgb(0 0 0 / 0.35); animation: splash-roll 2.3s 0.3s both; }
      @keyframes splash-pop { from { transform: scale(0.5); opacity: 0; } }
      @keyframes splash-up { from { transform: translateY(10px); opacity: 0; } }
      @keyframes splash-roll {
        0% { left: 0; animation-timing-function: cubic-bezier(.25, .7, .45, 1); }
        86% { left: 215px; transform: none; opacity: 1; animation-timing-function: ease-in; }
        100% { left: 217px; transform: translateY(6px) scale(0.45); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon-192.png" alt="" width="108" height="108" />
      <div class="name">GolfScoreHQ</div>
      <div class="tag">Your league, live.</div>
      <div class="green"><span class="ball"></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
