<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a47" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfScoreHQ" />
    <title>GolfScoreHQ</title>
    <!-- The splash: shown the moment the app opens, faded out by lib/splash.ts once the app is up. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: repeating-linear-gradient(135deg, rgb(255 255 255 / 0.035) 0 34px, transparent 34px 68px), radial-gradient(circle at 50% 38%, #1d4f86 0, #0f2a47 62%);
        color: #fff; font-family: 'Arial Narrow', -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.35s ease;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); animation: splash-pop 0.6s cubic-bezier(.2, 1.4, .4, 1) both; }
      #splash .name { font-size: 2.4rem; font-weight: 700; letter-spacing: 0.02em; animation: splash-up 0.5s 0.15s ease-out both; }
      #splash .tag { font-size: 1rem; opacity: 0.75; animation: splash-up 0.5s 0.3s ease-out both; }
      /* A putt on the green: the ball rolls in with a little break, drops into the cup and the pin shakes,
         just before the splash fades (lib/splash.ts: 3 s). The flag waves the whole time. */
      #splash .green { width: 300px; max-width: 84vw; height: auto; margin-top: 10px; overflow: visible; animation: splash-up 0.5s 0.2s ease-out both; }
      #splash .bx { transform: translateX(150px); animation: splash-bx 2.2s 0.35s both; }
      #splash .by { transform: translateY(90px); animation: splash-by 2.2s 0.35s both; }
      #splash .bs { animation: splash-drop 2.2s 0.35s both; }
      #splash .pin { transform-origin: 198px 84px; animation: splash-pin 0.55s 2.5s ease-out both; }
      #splash .flag { transform-origin: 199px 22px; animation: splash-wave 0.9s ease-in-out infinite alternate; }
      @keyframes splash-pop { from { transform: scale(0.5); opacity: 0; } }
      @keyframes splash-up { from { transform: translateY(10px); opacity: 0; } }
      /* Across: quick off the putter, slowing to the hole. Up: the break. */
      @keyframes splash-bx {
        0% { transform: translateX(38px); animation-timing-function: cubic-bezier(.2, .65, .4, 1); }
        90% { transform: translateX(195px); animation-timing-function: ease-in; }
        100% { transform: translateX(198px); }
      }
      @keyframes splash-by {
        0% { transform: translateY(100px); animation-timing-function: cubic-bezier(.35, .55, .55, 1); }
        90%, 100% { transform: translateY(84px); }
      }
      @keyframes splash-drop {
        0%, 89% { transform: none; opacity: 1; }
        100% { transform: translateY(2px) scale(0.4); opacity: 0; }
      }
      @keyframes splash-pin { 30% { transform: rotate(2.5deg); } 65% { transform: rotate(-1.5deg); } }
      @keyframes splash-wave { from { transform: skewY(-5deg) scaleX(0.92); } to { transform: skewY(4deg) scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon-192.png" alt="" width="108" height="108" />
      <div class="name">GolfScoreHQ</div>
      <div class="tag">Your league, live.</div>
      <svg class="green" viewBox="0 0 260 130" width="260" height="130">
        <defs>
          <radialGradient id="sp-green" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#63c463" /><stop offset="1" stop-color="#2e8a3f" /></radialGradient>
          <radialGradient id="sp-ball" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" /><stop offset="0.5" stop-color="#fff" /><stop offset="1" stop-color="#cfd5dc" /></radialGradient>
          <pattern id="sp-mow" width="40" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><rect width="20" height="10" fill="#fff" fill-opacity="0.08" /></pattern>
        </defs>
        <!-- The fringe, the green and its mowing stripes -->
        <ellipse cx="130" cy="86" rx="128" ry="43" fill="#23702f" />
        <ellipse cx="130" cy="86" rx="121" ry="38" fill="url(#sp-green)" />
        <ellipse cx="130" cy="86" rx="121" ry="38" fill="url(#sp-mow)" />
        <!-- The cup -->
        <ellipse cx="198" cy="84" rx="7.5" ry="3" fill="#0a2612" />
        <path d="M190.5 84a7.5 3 0 0 0 15 0" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="0.9" />
        <!-- The ball: across (bx), up for the break (by), and the drop (bs) -->
        <g class="bx"><g class="by"><g class="bs">
          <ellipse cx="1.5" cy="3.6" rx="5" ry="1.6" fill="#000" fill-opacity="0.28" />
          <circle r="4.6" fill="url(#sp-ball)" />
        </g></g></g>
        <!-- The flagstick, its shadow, and the flag -->
        <g class="pin">
          <line x1="198" y1="84" x2="224" y2="93" stroke="#000" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round" />
          <line x1="198" y1="84" x2="198" y2="13" stroke="#f3f3ee" stroke-width="2.2" stroke-linecap="round" />
          <path class="flag" d="M199 14 L228 21.5 L199 29 Z" fill="#e5443a" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
