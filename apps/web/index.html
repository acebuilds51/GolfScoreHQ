<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a47" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfScoreHQ" />
    <title>GolfScoreHQ</title>
    <!-- The splash: shown the moment the app opens, faded out by lib/splash.ts once the app is up.
         A short video (public/splash.mp4, 2.7 s): the ball on the tee bursts with gold sparks and leaps at the
         camera, and the clip ends on white. The whole screen follows it to white, then the app fades in. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #050506; color: #fff;
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; transition: opacity 0.35s ease;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .sp-video {
        position: absolute; left: 0; right: 0; top: 58vh; height: 62vh; width: 100%; transform: translateY(-50%); object-fit: cover; background: #050506;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at center, #000 72%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at center, #000 72%, transparent 100%);
      }
      #splash .sp-brand { position: absolute; top: 9vh; left: 0; right: 0; z-index: 2; text-align: center; animation: splash-up 0.7s 0.1s ease-out both; }
      #splash .sp-name { font-size: clamp(30px, 11vw, 76px); line-height: 1; letter-spacing: 0.01em; white-space: nowrap; color: #f4f1e8; filter: drop-shadow(0 3px 10px rgb(0 0 0 / 0.7)); }
      #splash .sp-gold {
        color: transparent;
        background: linear-gradient(110deg, transparent 40%, rgb(255 255 255 / 0.8) 50%, transparent 60%), linear-gradient(180deg, #fff6d2 0%, #f0cf73 38%, #b8862a 62%, #f7dc8e 100%);
        background-size: 250% 100%, 100% 100%; background-position: 130% 0, 0 0; background-repeat: no-repeat;
        -webkit-background-clip: text; background-clip: text;
        animation: splash-shine 1s 0.5s ease-in-out forwards;
      }
      #splash .sp-tag { margin-top: 14px; font: 600 clamp(11px, 3.2vw, 14px) -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: #d9b45a; }
      /* The white the clip ends on, spread over the whole screen; timed from when the video starts playing */
      #splash .sp-white { position: absolute; inset: 0; z-index: 3; background: #f4f5f2; opacity: 0; pointer-events: none; }
      #splash.play .sp-white { animation: splash-white 0.3s 2.35s ease-in forwards; }
      @keyframes splash-up { from { transform: translateY(12px); opacity: 0; } }
      @keyframes splash-shine { to { background-position: -30% 0, 0 0; } }
      @keyframes splash-white { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <video class="sp-video" src="/splash.mp4" poster="/splash-poster.jpg" autoplay muted playsinline preload="auto"></video>
      <div class="sp-brand">
        <div class="sp-name"><span class="sp-gold">Golf</span>Score<span class="sp-gold">HQ</span></div>
        <div class="sp-tag">Your league, live.</div>
      </div>
      <div class="sp-white"></div>
      <script>
        (() => {
          const v = document.querySelector('#splash video');
          // Still frame only for people who turn motion off.
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) { v.removeAttribute('autoplay'); v.pause(); return; }
          v.addEventListener('playing', () => document.getElementById('splash').classList.add('play'), { once: true });
        })();
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
