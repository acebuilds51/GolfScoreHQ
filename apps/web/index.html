<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a47" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfScoreHQ" />
    <title>GolfScoreHQ</title>
    <!-- The splash: shown the moment the app opens, faded out by lib/splash.ts once the app is up.
         A drive: the club takes it back and swings through (impact at 1.2 s), the ball flies straight at
         the screen until it fills it (2.75 s), and the app opens from behind it (lib/splash.ts: 3 s). -->
    <style>
      #splash {
        --b: min(36vw, 190px, 24vh); /* the ball's size; everything on the tee is sized from it */
        --x: calc(50% - var(--b) * 0.3); /* the tee, left of middle so the club fits on a phone */
        position: fixed; inset: 0; z-index: 1000; overflow: hidden; color: #fff;
        background: radial-gradient(ellipse at 50% 30%, #1d1c17 0, #0b0c0e 55%, #050506 100%);
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; transition: opacity 0.35s ease;
      }
      #splash.out { opacity: 0; pointer-events: none; }

      /* Gold traces in the background, with light running down them */
      #splash .sp-circuit { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .sp-circuit path { fill: none; stroke: #d4af37; stroke-opacity: 0.2; stroke-width: 1; vector-effect: non-scaling-stroke; }
      #splash .sp-circuit .sp-run path { stroke-opacity: 0.9; stroke-dasharray: 0.07 1; stroke-dashoffset: 0.07; animation: splash-run 1.6s ease-in infinite; }
      #splash .sp-circuit .sp-run path:nth-child(2n) { animation-delay: 0.5s; }
      #splash .sp-circuit .sp-run path:nth-child(3n) { animation-delay: 0.9s; }
      #splash .sp-circuit circle { fill: #d4af37; fill-opacity: 0.45; }

      /* The name */
      #splash .sp-brand { position: absolute; top: 11vh; left: 0; right: 0; z-index: 2; text-align: center; animation: splash-up 0.7s 0.1s ease-out both, splash-recede 0.8s 1.5s ease-in forwards; }
      #splash .sp-w1 {
        font-size: clamp(56px, 19vw, 104px); line-height: 0.9; letter-spacing: 0.04em; color: transparent;
        background: linear-gradient(110deg, transparent 40%, rgb(255 255 255 / 0.8) 50%, transparent 60%), linear-gradient(180deg, #fff6d2 0%, #f0cf73 38%, #b8862a 62%, #f7dc8e 100%);
        background-size: 250% 100%, 100% 100%; background-position: 130% 0, 0 0; background-repeat: no-repeat;
        -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 10px rgb(0 0 0 / 0.7));
        animation: splash-shine 1s 0.5s ease-in-out forwards;
      }
      #splash .sp-w2 { font-size: clamp(22px, 7.4vw, 40px); letter-spacing: 0.18em; margin-top: 6px; color: #f4f1e8; }
      #splash .sp-w2 b { color: #e9c467; }
      #splash .sp-tag { margin-top: 14px; font: 600 clamp(11px, 3.2vw, 14px) -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: #d9b45a; }

      /* The tee box: gold dust, the ball's shadow, the tee */
      #splash .sp-turf {
        position: absolute; left: var(--x); top: calc(60vh + var(--b) * 0.55); width: calc(var(--b) * 4.2); height: calc(var(--b) * 1.1); transform: translate(-50%, -50%);
        background: radial-gradient(rgb(240 200 100 / 0.9) 0.7px, transparent 1.3px) 0 0 / 6px 6px, radial-gradient(rgb(255 225 150 / 0.7) 0.6px, transparent 1.2px) 3px 2px / 9px 7px, radial-gradient(ellipse closest-side, rgb(212 170 70 / 0.28), transparent);
        -webkit-mask-image: radial-gradient(ellipse closest-side, #000 15%, transparent 100%); mask-image: radial-gradient(ellipse closest-side, #000 15%, transparent 100%);
      }
      #splash .sp-shadow { position: absolute; left: var(--x); top: calc(60vh + var(--b) * 0.86); width: calc(var(--b) * 0.9); height: calc(var(--b) * 0.16); transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(ellipse closest-side, rgb(0 0 0 / 0.65), transparent); animation: splash-fade 0.25s 1.2s forwards; }
      #splash .sp-tee {
        position: absolute; left: var(--x); top: calc(60vh + var(--b) * 0.38); width: calc(var(--b) * 0.34); height: calc(var(--b) * 0.5); transform: translateX(-50%);
        background: linear-gradient(90deg, #9c8d70, #f1e9d8 40%, #cfc2a6 70%, #8a7c60); clip-path: polygon(0 0, 100% 0, 62% 22%, 56% 100%, 44% 100%, 38% 22%);
        -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent);
      }

      /* The driver: swings around the golfer's hands, far up and to the right */
      #splash .sp-club { position: absolute; z-index: 1; left: calc(var(--x) + var(--b) * 0.38); top: calc(60vh - var(--b) * 0.16); width: calc(var(--b) * 1.1); height: auto; overflow: visible; transform-origin: 150% -217%; animation: splash-swing 1.2s 0.3s both; }

      /* The ball */
      #splash .sp-ball {
        position: absolute; z-index: 4; left: var(--x); top: 60vh; width: var(--b); height: var(--b); margin: calc(var(--b) / -2) 0 0 calc(var(--b) / -2); border-radius: 50%; overflow: hidden;
        background: radial-gradient(circle at 36% 30%, #fff 0, #f2f4f6 28%, #cdd2d8 62%, #8d939b 88%, #6d737b 100%);
        box-shadow: inset -6px -8px 18px rgb(0 0 0 / 0.25), inset 4px 6px 14px rgb(255 255 255 / 0.6), 0 0 34px rgb(230 190 90 / 0.18);
        animation: splash-fly 1.55s 1.2s linear both;
      }
      #splash .sp-ball::after {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, rgb(255 255 255 / 0.85) 0, rgb(255 255 255 / 0) 22%), radial-gradient(circle at 40% 36%, transparent 45%, rgb(40 44 52 / 0.55) 100%), radial-gradient(ellipse at 50% 108%, rgb(232 190 90 / 0.4), transparent 42%);
      }
      #splash .sp-dimples { position: absolute; inset: 0; -webkit-mask-image: radial-gradient(circle, #000 42%, transparent 71%); mask-image: radial-gradient(circle, #000 42%, transparent 71%); }
      #splash .sp-dimples::before {
        --c: calc(var(--b) * 0.085);
        content: ''; position: absolute; left: -10%; right: -10%; top: -100%; bottom: -10%;
        background-image: radial-gradient(circle calc(var(--b) * 0.036) at 50% 50%, rgb(0 0 0 / 0.2), rgb(0 0 0 / 0.07) 70%, transparent 100%), radial-gradient(circle calc(var(--b) * 0.036) at 50% 50%, rgb(0 0 0 / 0.2), rgb(0 0 0 / 0.07) 70%, transparent 100%);
        background-size: var(--c) calc(var(--c) * 1.732); background-position: 0 0, calc(var(--c) / 2) calc(var(--c) * 0.866);
        animation: splash-spin 1.55s 1.2s linear both;
      }

      /* Impact: a flash behind the ball and gold sparks */
      #splash .sp-flash { position: absolute; z-index: 3; left: var(--x); top: 60vh; width: calc(var(--b) * 2.4); height: calc(var(--b) * 2.4); margin: calc(var(--b) * -1.2) 0 0 calc(var(--b) * -1.2); border-radius: 50%; opacity: 0; background: radial-gradient(circle, rgb(255 250 230) 0, rgb(255 215 120 / 0.7) 20%, rgb(212 160 60 / 0.25) 40%, transparent 65%); animation: splash-flash 0.45s 1.2s ease-out; }
      #splash .sp-sparks { position: absolute; z-index: 5; left: var(--x); top: 60vh; }
      #splash .sp-sparks i { position: absolute; left: 0; top: -1px; width: calc(var(--b) * 0.22); height: 2px; border-radius: 2px; transform-origin: 0 50%; opacity: 0; background: linear-gradient(90deg, rgb(255 230 160 / 0), #ffd77a, #fff); animation: splash-spark var(--d, 0.5s) 1.2s ease-out; }

      @keyframes splash-up { from { transform: translateY(12px); opacity: 0; } }
      @keyframes splash-recede { to { transform: scale(0.94); opacity: 0.25; } }
      @keyframes splash-shine { to { background-position: -30% 0, 0 0; } }
      @keyframes splash-run { to { stroke-dashoffset: -1; } }
      @keyframes splash-fade { to { opacity: 0; } }
      /* Takeaway, a beat at the top, a fast downswing (impact at 75%), follow-through out of sight */
      @keyframes splash-swing {
        0% { transform: none; animation-timing-function: ease-in-out; }
        50%, 58% { transform: translate(calc(var(--b) * 0.16), calc(var(--b) * -0.05)) rotate(-4deg); animation-timing-function: cubic-bezier(.6, 0, 1, 1); }
        66% { filter: blur(1.5px); }
        75% { transform: translateX(calc(var(--b) * -0.55)); animation-timing-function: ease-out; opacity: 1; }
        100% { transform: translate(calc(var(--b) * -2), calc(var(--b) * -0.7)) rotate(18deg); opacity: 0; filter: blur(2px); }
      }
      /* Straight at the camera: it grows slowly, then fast as it gets close, and rises to the middle */
      @keyframes splash-fly {
        0% { transform: translate(0, 0) scale(1); }
        30% { transform: translate(calc(var(--b) * 0.12), -2vh) scale(1.5); }
        55% { transform: translate(calc(var(--b) * 0.2), -4vh) scale(2.4); }
        75% { transform: translate(calc(var(--b) * 0.26), -7vh) scale(4.2); }
        88% { transform: translate(calc(var(--b) * 0.29), -9vh) scale(7.5); }
        100% { transform: translate(calc(var(--b) * 0.3), -10vh) scale(16); }
      }
      @keyframes splash-spin { to { transform: translateY(calc(var(--b) * 0.085 * 1.732 * 5)); } }
      @keyframes splash-flash { from { transform: scale(0.3); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
      @keyframes splash-spark {
        from { opacity: 1; transform: rotate(var(--a)) translateX(calc(var(--b) * 0.35)) scaleX(0.3); }
        to { opacity: 0; transform: rotate(var(--a)) translateX(calc(var(--b) * 1.5)) scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) { #splash, #splash *, #splash *::before { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="sp-circuit" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
        <g>
          <path d="M200 0V52" /><path d="M150 0V40L120 70V130" /><path d="M250 0V40L280 70V130" />
          <path d="M90 0V90L60 120V230" /><path d="M310 0V90L340 120V230" /><path d="M30 0V150L0 180" /><path d="M370 0V150L400 180" />
          <path d="M0 520H70L100 550H150" /><path d="M400 520H330L300 550H250" /><path d="M0 600H40L60 620" /><path d="M400 600H360L340 620" />
        </g>
        <g class="sp-run">
          <path pathLength="1" d="M150 0V40L120 70V130" /><path pathLength="1" d="M310 0V90L340 120V230" /><path pathLength="1" d="M90 0V90L60 120V230" />
          <path pathLength="1" d="M250 0V40L280 70V130" /><path pathLength="1" d="M0 520H70L100 550H150" /><path pathLength="1" d="M400 520H330L300 550H250" />
        </g>
        <circle cx="200" cy="52" r="2.2" /><circle cx="120" cy="130" r="2.2" /><circle cx="280" cy="130" r="2.2" /><circle cx="60" cy="230" r="2.2" />
        <circle cx="340" cy="230" r="2.2" /><circle cx="150" cy="550" r="2.2" /><circle cx="250" cy="550" r="2.2" />
      </svg>
      <div class="sp-brand">
        <div class="sp-w1">GOLF</div>
        <div class="sp-w2">SCORE <b>HQ</b></div>
        <div class="sp-tag">Your league, live.</div>
      </div>
      <div class="sp-turf"></div>
      <div class="sp-shadow"></div>
      <div class="sp-tee"></div>
      <svg class="sp-club" viewBox="0 0 200 120" width="200" height="120">
        <defs>
          <linearGradient id="sp-crown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5059" /><stop offset="0.45" stop-color="#1d2127" /><stop offset="1" stop-color="#08090b" /></linearGradient>
          <linearGradient id="sp-face" x1="0" x2="1"><stop offset="0" stop-color="#2b2f35" /><stop offset="0.5" stop-color="#737a83" /><stop offset="1" stop-color="#2b2f35" /></linearGradient>
        </defs>
        <line x1="174" y1="26" x2="300" y2="-260" stroke="#8d939b" stroke-width="5" stroke-linecap="round" />
        <line x1="175.5" y1="25" x2="301.5" y2="-261" stroke="#eef0f3" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8" />
        <path d="M160 30L172 20L182 27L170 37Z" fill="#2a2e34" />
        <path d="M24 66C22 40 52 20 104 18C150 16 186 30 190 56C194 84 168 104 118 106C70 108 26 96 24 66Z" fill="url(#sp-crown)" />
        <ellipse cx="112" cy="34" rx="58" ry="8" fill="#fff" fill-opacity="0.1" />
        <path d="M40 40C70 24 130 18 170 30" fill="none" stroke="#d4af37" stroke-width="1.6" stroke-opacity="0.9" />
        <path d="M36 92C70 106 140 106 182 80" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.35" />
        <path d="M24 66C22 46 32 32 46 26C42 50 44 80 54 102C36 96 25 84 24 66Z" fill="url(#sp-face)" />
        <path d="M30 50L44 46M28 60L44 57M28 70L46 68M30 80L48 79M33 90L50 90" stroke="#fff" stroke-opacity="0.22" stroke-width="0.8" />
      </svg>
      <div class="sp-flash"></div>
      <div class="sp-ball"><div class="sp-dimples"></div></div>
      <div class="sp-sparks">
        <i style="--a: -10deg"></i><i style="--a: 20deg; --d: 0.42s"></i><i style="--a: 50deg"></i><i style="--a: 80deg; --d: 0.38s"></i>
        <i style="--a: 115deg; --d: 0.55s"></i><i style="--a: 150deg"></i><i style="--a: 185deg; --d: 0.45s"></i><i style="--a: 215deg"></i>
        <i style="--a: 245deg; --d: 0.6s"></i><i style="--a: 275deg"></i><i style="--a: 305deg; --d: 0.4s"></i><i style="--a: 335deg; --d: 0.52s"></i>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
